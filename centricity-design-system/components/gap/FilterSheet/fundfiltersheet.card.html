<!-- @dsCard group="Components" viewport="400x520" name="FundFilterSheet" subtitle="Bottom-sheet multi-select filters + sticky Apply (n)" -->
<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../../_ds_bundle.js"></script>
<style>body{background:#0D0D0D;background:var(--surface-canvas);margin:0;}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { FundFilterSheet } = window.CentricityDesignSystem_35f9eb;
function Demo(){
  const [sel,setSel]=React.useState({cat:["Flexi Cap"],risk:["Moderate","High"]});
  const toggle=(k,o)=>setSel(s=>{const a=s[k]||[];return {...s,[k]:a.includes(o)?a.filter(x=>x!==o):[...a,o]};});
  const count=Object.values(sel).reduce((n,a)=>n+a.length,0);
  return <FundFilterSheet count={count} selected={sel} onToggle={toggle} onClear={()=>setSel({})}
    groups={[
      {key:"cat",label:"Category",options:["Flexi Cap","Large Cap","Mid Cap","ELSS","Debt","Hybrid"]},
      {key:"amc",label:"AMC",options:["Parag Parikh","HDFC","Axis","SBI","ICICI"]},
      {key:"risk",label:"Risk",options:["Low","Moderate","High","Very High"]},
    ]} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
