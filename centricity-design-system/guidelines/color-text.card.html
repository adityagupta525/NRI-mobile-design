<!-- @dsCard group="Colors" viewport="700x150" name="Text & neutrals" subtitle="Cream primary, grey secondary/tertiary/disabled" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:#191919;background:var(--surface-card);font-family:var(--font-ui);}
.row{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.item{display:flex;flex-direction:column;gap:4px}
.lbl{font-size:16px;font-weight:600}
.hex{font-family:var(--font-numeral);color:var(--grey-500);font-size:10px}</style></head>
<body><div class="row">
<div class="item"><span class="lbl" style="color:var(--cream-100)">Cream 100</span><span class="hex">#F2EEE3 · warm text</span></div>
<div class="item"><span class="lbl" style="color:var(--text-primary)">Primary</span><span class="hex">white 92%</span></div>
<div class="item"><span class="lbl" style="color:var(--text-secondary)">Secondary</span><span class="hex">white 82%</span></div>
<div class="item"><span class="lbl" style="color:var(--text-tertiary)">Tertiary</span><span class="hex">white 72%</span></div>
<div class="item"><span class="lbl" style="color:var(--text-meta)">Meta</span><span class="hex">#9CA3AF</span></div>
</div></body></html>
