<!-- @dsCard group="Colors" viewport="700x150" name="Obsidian surfaces" subtitle="Layered depth — base → raised → card → sheet → pressed" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:#0D0D0D;background:var(--surface-canvas);font-family:var(--font-ui);}
.row{display:flex;gap:10px}
.sw{flex:1;height:96px;border-radius:var(--radius-md);border:1px solid var(--hairline-div);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:var(--cream-200);font-size:11px}
.hex{font-family:var(--font-numeral);color:var(--grey-400);font-size:10px}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--obsidian-950)">950 canvas<span class="hex">#0D0D0D</span></div>
<div class="sw" style="background:var(--obsidian-900)">900 surface<span class="hex">#111111</span></div>
<div class="sw" style="background:var(--obsidian-850)">850 card<span class="hex">#191919</span></div>
<div class="sw" style="background:var(--obsidian-800)">800 sheet<span class="hex">#212121</span></div>
<div class="sw" style="background:var(--obsidian-700)">700 pressed<span class="hex">#2A2D2F</span></div>
</div></body></html>
