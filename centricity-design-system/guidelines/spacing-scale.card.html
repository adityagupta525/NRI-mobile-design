<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4pt grid — 4/8/12/16/20/24/32/40/48/64" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:#0D0D0D;background:var(--surface-canvas);font-family:var(--font-ui);}
.row{display:flex;gap:8px;align-items:flex-end}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:var(--accent-sheen);border-radius:2px;width:100%}
.n{font-family:var(--font-numeral);color:var(--grey-400);font-size:10px}</style></head>
<body><div class="row">
<div class="col" style="width:22px"><div class="bar" style="height:4px"></div><span class="n">4</span></div>
<div class="col" style="width:26px"><div class="bar" style="height:8px"></div><span class="n">8</span></div>
<div class="col" style="width:30px"><div class="bar" style="height:12px"></div><span class="n">12</span></div>
<div class="col" style="width:34px"><div class="bar" style="height:16px"></div><span class="n">16</span></div>
<div class="col" style="width:38px"><div class="bar" style="height:20px"></div><span class="n">20</span></div>
<div class="col" style="width:42px"><div class="bar" style="height:24px"></div><span class="n">24</span></div>
<div class="col" style="width:48px"><div class="bar" style="height:32px"></div><span class="n">32</span></div>
<div class="col" style="width:54px"><div class="bar" style="height:40px"></div><span class="n">40</span></div>
<div class="col" style="width:60px"><div class="bar" style="height:48px"></div><span class="n">48</span></div>
<div class="col" style="width:70px"><div class="bar" style="height:64px"></div><span class="n">64</span></div>
</div></body></html>
