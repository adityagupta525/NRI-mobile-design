<!-- @dsCard group="Colors" viewport="700x150" name="Copper accent" subtitle="The only accent — sheen ramp + shimmer stroke" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:#0D0D0D;background:var(--surface-canvas);font-family:var(--font-ui);}
.row{display:flex;gap:10px}
.sw{flex:1;height:96px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:var(--ink-900);font-size:11px;font-weight:600}
.hex{font-family:var(--font-numeral);opacity:.7;font-size:10px}
.sheen{background:var(--accent-sheen)}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--copper-600)">600<span class="hex">#8A6F55</span></div>
<div class="sw" style="background:var(--copper-500)">500 core<span class="hex">#B69377</span></div>
<div class="sw" style="background:var(--copper-400)">400<span class="hex">#C9A888</span></div>
<div class="sw" style="background:var(--copper-200)">200<span class="hex">#F2E6CE</span></div>
<div class="sw" style="background:var(--accent-metal)">metal CTA<span class="hex">champagne</span></div>
</div></body></html>
